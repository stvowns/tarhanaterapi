[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Statik prerender edilmiş sayfalar (AI botları JS çalıştırmadan içeriği görsün).
# Sıra önemli: özel kurallar en üstte, SPA fallback en altta.
[[redirects]]
  from = "/urunler"
  to = "/urunler/tarhana-classic"
  status = 301

[[redirects]]
  from = "/urunler/:id"
  to = "/urunler/:id.html"
  status = 200

[[redirects]]
  from = "/icerik"
  to = "/icerik.html"
  status = 200

[[redirects]]
  from = "/hikaye"
  to = "/hikaye.html"
  status = 200

[[redirects]]
  from = "/yorumlar"
  to = "/yorumlar.html"
  status = 200

[[redirects]]
  from = "/iletisim"
  to = "/iletisim.html"
  status = 200

[[redirects]]
  from = "/rehber"
  to = "/rehber.html"
  status = 200

[[redirects]]
  from = "/rehber/:slug"
  to = "/rehber/:slug.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML her deploy'da tazelenir; hash'li asset'ler kalıcı cache'lenir.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
