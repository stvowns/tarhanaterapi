<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Sayfa Bulunamadı | TarhanaTerapi</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #2d2424;
        --muted: #6b5f57;
        --cream: #fbf7ef;
        --paper: #fffdf9;
        --line: #e7ddd0;
        --primary: #31523c;
        --accent: #c84b31;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 10%, rgba(200, 75, 49, 0.08), transparent 35%),
          radial-gradient(circle at 90% 90%, rgba(49, 82, 60, 0.1), transparent 40%),
          var(--cream);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: min(680px, 100%);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: clamp(28px, 6vw, 56px);
        box-shadow: 0 24px 60px -28px rgba(45, 36, 36, 0.28);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 700;
      }
      .brand img { width: 34px; height: 34px; object-fit: contain; }
      .code {
        margin-top: 34px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(64px, 14vw, 110px);
        line-height: 0.9;
        color: var(--primary);
        letter-spacing: -4px;
      }
      h1 {
        margin: 18px 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(26px, 4vw, 38px);
        line-height: 1.15;
      }
      p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 15px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-ghost { background: #f3ede3; color: var(--ink); }
      .links {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
        font-size: 13px;
      }
      .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="/" aria-label="TarhanaTerapi ana sayfa">
        <img src="/logo.svg" alt="" />
        <span>TarhanaTerapi</span>
      </a>

      <div class="code" aria-hidden="true">404</div>
      <h1>Bu sayfa kilerde kalmış olabilir.</h1>
      <p>
        Aradığınız sayfayı bulamadık. Adres değişmiş veya sayfa kaldırılmış olabilir.
        Tarhana çeşitlerimize göz atabilir ya da ana sayfadan devam edebilirsiniz.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/urunler">Tarhana Çeşitleri</a>
        <a class="btn btn-ghost" href="/">Ana Sayfa</a>
      </div>

      <nav class="links" aria-label="Faydalı bağlantılar">
        <a href="/rehber">Tarhana Rehberi</a>
        <a href="/yorumlar">Yorumlar</a>
        <a href="/iletisim">İletişim</a>
        <a href="/kvkk">KVKK</a>
      </nav>
    </main>
  </body>
</html>
